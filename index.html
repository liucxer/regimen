<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>每日营养计算器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #10b981;
    --accent-dim: #d1fae5;
    --warn: #f59e0b;
    --over: #ef4444;
    --p: #3b82f6;
    --f: #f59e0b;
    --c: #8b5cf6;
    --k: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  body {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 14px 100px;
  }
  header {
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 14px;
    font-weight: 700;
  }
  .settings {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .mode-switch {
    display: flex;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 12px;
  }
  .mode-switch button {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 8px;
    transition: all .2s;
  }
  .mode-switch button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .weight-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .weight-row input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    color: var(--ink);
    background: var(--bg);
  }
  .weight-row input:focus { outline: none; border-color: var(--accent); }

  .meal {
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 12px;
    padding: 14px 14px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .meal h2 {
    font-size: 16px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .meal h2::before {
    content: '';
    width: 4px; height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }
  .foods {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .food {
    display: flex;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .food:last-child { border-bottom: 0; }
  .food input[type=checkbox] {
    width: 20px; height: 20px;
    margin: 0 12px 0 0;
    accent-color: var(--accent);
  }
  .food .name {
    flex: 1;
    font-size: 15px;
  }
  .food .macro {
    font-size: 12px;
    color: var(--muted);
  }
  .food input:checked + .name { color: var(--accent); font-weight: 600; }

  .calc-btn {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 28px);
    max-width: 532px;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: var(--ink);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(15,23,42,.25);
    z-index: 10;
  }
  .calc-btn:active { transform: translateX(-50%) scale(.98); }

  .result {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .result h2 {
    font-size: 16px;
    margin: 0 0 14px;
  }
  .metric { margin-bottom: 14px; }
  .metric:last-child { margin-bottom: 0; }
  .metric .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .metric .label {
    font-size: 14px;
    font-weight: 600;
  }
  .metric .vals {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .metric .vals .actual {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }
  .bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    border-radius: 4px;
    transition: width .4s ease;
  }
  .metric[data-k=p] .label { color: var(--p); }
  .metric[data-k=p] .bar > div { background: var(--p); }
  .metric[data-k=f] .label { color: var(--f); }
  .metric[data-k=f] .bar > div { background: var(--f); }
  .metric[data-k=c] .label { color: var(--c); }
  .metric[data-k=c] .bar > div { background: var(--c); }
  .metric[data-k=k] .label { color: var(--k); }
  .metric[data-k=k] .bar > div { background: var(--k); }
  .metric.over .bar > div { background: var(--over) !important; }

  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 12px;
    line-height: 1.6;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>每日营养计算器</h1>
  <div class="settings">
    <div class="mode-switch" id="modeSwitch">
      <button class="active" data-mode="bulk">增肌期</button>
      <button data-mode="cut">减脂期</button>
    </div>
    <div class="weight-row">
      <span>体重</span>
      <input type="number" id="weight" value="65" min="30" max="200" inputmode="decimal">
      <span>kg</span>
    </div>
  </div>
</header>

<main id="meals"></main>

<button class="calc-btn" id="calcBtn">计算今日摄入</button>

<section id="result" class="result hidden">
  <h2>今日摄入 vs 目标</h2>
  <div class="metric" data-k="p">
    <div class="head">
      <span class="label">蛋白质</span>
      <span class="vals"><span class="actual" id="aP">0</span> / <span id="tP">0</span> g</span>
    </div>
    <div class="bar"><div id="bP" style="width:0%"></div></div>
  </div>
  <div class="metric" data-k="f">
    <div class="head">
      <span class="label">脂肪</span>
      <span class="vals"><span class="actual" id="aF">0</span> / <span id="tF">0</span> g</span>
    </div>
    <div class="bar"><div id="bF" style="width:0%"></div></div>
  </div>
  <div class="metric" data-k="c">
    <div class="head">
      <span class="label">碳水</span>
      <span class="vals"><span class="actual" id="aC">0</span> / <span id="tC">0</span> g</span>
    </div>
    <div class="bar"><div id="bC" style="width:0%"></div></div>
  </div>
  <div class="metric" data-k="k">
    <div class="head">
      <span class="label">热量</span>
      <span class="vals"><span class="actual" id="aK">0</span> / <span id="tK">0</span> kcal</span>
    </div>
    <div class="bar"><div id="bK" style="width:0%"></div></div>
  </div>
  <p class="hint" id="hint"></p>
</section>

<script>
  const FOODS = {
    rice:        { name: '米饭一碗',         p: 4,   f: 0.5, c: 35 },
    noodle:      { name: '面条一碗(熟)',     p: 7,   f: 1,   c: 38 },
    sweetPotato: { name: '红薯 100g',        p: 1.6, f: 0.2, c: 20 },
    oat:         { name: '燕麦 50g (干)',    p: 7,   f: 3,   c: 33 },
    bread:       { name: '全麦面包 1 片',    p: 4,   f: 1.5, c: 18 },
    chicken:     { name: '生鲜鸡胸 100g',    p: 23,  f: 1.5, c: 0  },
    egg:         { name: '鸡蛋 1 个',        p: 6,   f: 5,   c: 0.5},
    eggWhite:    { name: '蛋白 1 个',        p: 4,   f: 0,   c: 0.3},
    beef:        { name: '瘦牛肉 100g',      p: 20,  f: 5,   c: 0  },
    salmon:      { name: '三文鱼 100g',      p: 20,  f: 13,  c: 0  },
    veggie:      { name: '蔬菜 200g',        p: 4,   f: 0.4, c: 8  },
    milk:        { name: '牛奶 250ml',       p: 8,   f: 8,   c: 12 },
    banana:      { name: '香蕉 1 根',        p: 1.3, f: 0.3, c: 27 },
    apple:       { name: '苹果 1 个',        p: 0.3, f: 0.2, c: 25 },
    nuts:        { name: '坚果 30g',         p: 6,   f: 18,  c: 6  },
    powder:      { name: '蛋白粉 1 勺 (30g)',p: 24,  f: 1,   c: 2  },
  };

  const MEALS = [
    { id: 'breakfast',   name: '早餐',  items: ['oat','egg','eggWhite','milk','bread','banana'] },
    { id: 'lunch',       name: '午餐',  items: ['rice','chicken','beef','veggie','sweetPotato','egg'] },
    { id: 'dinner',      name: '晚餐',  items: ['rice','chicken','salmon','eggWhite','veggie','noodle'] },
    { id: 'postworkout', name: '练后餐',items: ['powder','banana','milk','apple','rice','nuts'] },
  ];

  // g per kg body weight
  const TARGETS = {
    bulk: { p: 2.0, f: 1.0, c: 5.0 },
    cut:  { p: 2.2, f: 0.8, c: 2.5 },
  };

  const kcal = (p, f, c) => Math.round(p * 4 + c * 4 + f * 9);
  const $ = id => document.getElementById(id);

  // Render meals
  const mealsRoot = $('meals');
  MEALS.forEach(m => {
    const sec = document.createElement('section');
    sec.className = 'meal';
    sec.dataset.meal = m.id;
    sec.innerHTML = `<h2>${m.name}</h2><ul class="foods">` +
      m.items.map(key => {
        const f = FOODS[key];
        return `<li>
          <label class="food">
            <input type="checkbox" data-food="${key}">
            <span class="name">${f.name}</span>
            <span class="macro">P${f.p} · F${f.f} · C${f.c}</span>
          </label>
        </li>`;
      }).join('') +
      `</ul>`;
    mealsRoot.appendChild(sec);
  });

  // Mode switch
  let mode = 'bulk';
  $('modeSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    [...e.currentTarget.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === btn));
    mode = btn.dataset.mode;
  });

  // Calculate
  $('calcBtn').addEventListener('click', () => {
    const w = parseFloat($('weight').value) || 0;
    let P = 0, F = 0, C = 0;
    document.querySelectorAll('input[data-food]:checked').forEach(cb => {
      const f = FOODS[cb.dataset.food];
      P += f.p; F += f.f; C += f.c;
    });

    const t = TARGETS[mode];
    const tP = Math.round(t.p * w);
    const tF = Math.round(t.f * w);
    const tC = Math.round(t.c * w);
    const tK = kcal(tP, tF, tC);
    const aK = kcal(P, F, C);

    const fmt = n => (Math.round(n * 10) / 10).toString();
    $('aP').textContent = fmt(P); $('tP').textContent = tP;
    $('aF').textContent = fmt(F); $('tF').textContent = tF;
    $('aC').textContent = fmt(C); $('tC').textContent = tC;
    $('aK').textContent = aK;     $('tK').textContent = tK;

    const setBar = (id, actual, target, key) => {
      const pct = target ? Math.min(100, (actual / target) * 100) : 0;
      $(id).style.width = pct + '%';
      const metric = $(id).closest('.metric');
      metric.classList.toggle('over', target > 0 && actual > target * 1.1);
    };
    setBar('bP', P, tP); setBar('bF', F, tF); setBar('bC', C, tC); setBar('bK', aK, tK);

    // Hint
    const modeName = mode === 'bulk' ? '增肌期' : '减脂期';
    const gap = tP - P;
    let hint = `${modeName} 目标基于体重 ${w}kg 计算（蛋白 ${t.p}g/kg · 脂肪 ${t.f}g/kg · 碳水 ${t.c}g/kg）。`;
    if (gap > 5) hint += ` 蛋白还差 ${Math.round(gap)}g，可加 1 勺蛋白粉或 100g 鸡胸。`;
    else if (P > tP * 1.2) hint += ` 蛋白偏高，注意肾脏负担。`;
    $('hint').textContent = hint;

    $('result').classList.remove('hidden');
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>
</body>
</html>
